# 大陆服务器 + 仅公网 IP 访问（没有域名/备案时用这个）
# 启动：docker compose -f docker-compose.ip.yml up -d --build
# 访问：http://服务器公网IP:8080
services:
  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      YJ_SECRET: ${YJ_SECRET:?请在 .env 设置 YJ_SECRET}
      YJ_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./.nicegui:/app/.nicegui
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/login', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
